name: Java Application CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_NAME: devopscia2naren
  IMAGE_NAME: java-cicd-app
  RESOURCE_GROUP: rg-devops-cia2
  AKS_CLUSTER: aks-devops-cia2

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:latest"

      - name: Connect to AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: 'true'

      - name: Deploy updated image
        run: |
          kubectl set image deployment/java-cicd-app \
            java-cicd-app="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/java-cicd-app --timeout=180s
          kubectl get pods