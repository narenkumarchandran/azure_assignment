name: Java Application CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: devopscia2naren
  IMAGE_NAME: java-cicd-app
  RESOURCE_GROUP: rg-devops-cia2
  AKS_CLUSTER: aks-devops-cia2
  NAMESPACE: default

jobs:
  build-test-deploy:
    name: Build, Test, Push and Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Install Java 21 and configure Maven cache
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Compile the application and execute tests
      - name: Build and test with Maven
        run: mvn --batch-mode clean verify

      # 4. Authenticate to Azure using GitHub OIDC
      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 5. Authenticate Docker with Azure Container Registry
      - name: Log in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      # 6. Build Docker image using the Git commit SHA as its version
      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:latest" \
            .

      # 7. Push versioned image and latest tag to ACR
      - name: Push Docker image to ACR
        run: |
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA"
          docker push "$ACR_NAME.azurecr.io/$IMAGE_NAME:latest"

      # 8. Configure kubectl to access AKS
      - name: Connect to AKS
        uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER }}
          admin: 'true'

      # 9. Update the Kubernetes Deployment to use the new image
      - name: Deploy application to AKS
        run: |
          kubectl set image deployment/java-cicd-app \
            java-cicd-app="$ACR_NAME.azurecr.io/$IMAGE_NAME:$GITHUB_SHA" \
            --namespace "$NAMESPACE"

      # 10. Wait for Kubernetes to complete the rollout
      - name: Verify deployment
        run: |
          kubectl rollout status deployment/java-cicd-app \
            --namespace "$NAMESPACE" \
            --timeout=180s

      # 11. Display the deployment and service status
      - name: Display Kubernetes resources
        run: |
          kubectl get deployments --namespace "$NAMESPACE"
          kubectl get pods --namespace "$NAMESPACE"
          kubectl get services --namespace "$NAMESPACE"
